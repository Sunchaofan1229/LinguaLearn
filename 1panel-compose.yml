networks:
  1panel-net:
    external: true
    name: 1panel-network

services:
  app:
    build:
      context: /opt/lingualearn
      dockerfile: Dockerfile
    container_name: lingualearn-app
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - 1panel-net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["*"]'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      APP_NAME: "LinguaLearn API"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
